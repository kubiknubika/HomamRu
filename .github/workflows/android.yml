name: Android

# Собирает приложение для Android (отладочная сборка) на каждый коммит.
# Файл APK лежит в двух местах:
#  - в артефактах запуска;
#  - в предварительном выпуске «android-latest» — по прямой ссылке, удобно с телефона.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Установка pnpm, Node.js и зависимостей
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@22
          cache: true
      - name: Номер сборки
        run: echo "VITE_BUILD_ID=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Сборка клиента
        run: pnpm run build
      - name: Копирование сборки в проект Android
        run: pnpm --filter @homamru/client exec cap sync android
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Сборка APK
        working-directory: packages/client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/geroi-ru.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geroi-ru-apk
          path: ${{ runner.temp }}/geroi-ru.apk
          if-no-files-found: error
      - name: Обновление выпуска android-latest
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: "Отладочная сборка для проверки на телефоне. Сборка ${{ env.VITE_BUILD_ID }}, ветка ${{ github.ref_name }}. Ставится поверх прежней версии."
        run: |
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --prerelease --title "Android: последняя сборка" --notes "$NOTES"
          fi
          gh release upload android-latest "$RUNNER_TEMP/geroi-ru.apk" --clobber
          gh release edit android-latest --notes "$NOTES"
