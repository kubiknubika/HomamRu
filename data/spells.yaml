# Заклинания (docs/mechanics/60-spells.md, 62-battle-spells.md).
# Числа — из таблицы Heroes 3, для героя без навыка школы. chance — вес в наборе гильдии магов
# (числа замка людей); 0 — в гильдии не бывает.
# effect — что делает заклинание; target — на кого накладывается: enemy или ally.
# С навыком школы (docs/mechanics/65-hero-skills.md): skilledCost — цена; values — число value
# на базовом, продвинутом и экспертном уровне; expertMass — на экспертном ложится на все
# подходящие отряды; advancedAnyTarget — с продвинутого ложится и на чужой отряд.
