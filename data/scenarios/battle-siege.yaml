name: Осада — стена не пускает, ров ранит и останавливает, закрытые ворота нападающему — стена
battle: test-siege
seed: 1
steps:
  # До первого хода стреляют главная башня и катапульта. Соколы ходят первыми.
  # На клетку стены не встать даже летающему.
  - move: [10, 2]
    expectError: CELL_UNREACHABLE
  - move: [7, 3]
  - shoot: a1
  - move: [4, 8]
  # Второй раунд. Соколы садятся в ров: 70 урона — четверо убиты, ход кончен.
  - move: [8, 4]
  - shoot: a1
  # Ворота закрыты: проём для нападающего — стена.
  - move: [9, 5]
    expectError: CELL_UNREACHABLE
  - move: [8, 8]
expect:
  stacks:
    a1: { cell: [8, 4], count: 22 }
    a2: { cell: [8, 8] }
